<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitura Diária da Bíblia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- Cabeçalho -->
        <header class="app-header">
            <button class="theme-toggle" id="theme-toggle" title="Alternar Tema">🌙</button>
            <h1>LEITURA DIÁRIA</h1>
            <p>DA BÍBLIA</p>
        </header>

        <!-- Card Principal -->
        <main class="main-card">
            
            <!-- Bloco Principal -->
            <div class="bloco-principal">
                <!-- Input de data invisível para o calendário nativo -->
                <input type="date" id="hidden-date-picker" style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">

                <!-- Data (Clicável) e Botão Voltar -->
                <div class="date-container">
                    <button class="date-badge" id="display-date" style="cursor: pointer; font-family: inherit;">
                        Carregando...
                    </button>
                    <button class="btn-voltar-hoje" id="btn-voltar-hoje" style="display: none;" title="Voltar para Hoje">
                        ↺
                    </button>
                </div>

                <!-- Leitura -->
                <div class="reading-content">
                    <h2 id="display-reading">...</h2>
                </div>

                <!-- Botões de Ação -->
                <div id="jw-buttons-container" class="jw-buttons-container"></div>

                <div class="action-buttons">
                    <a href="#" id="btn-ler" class="btn btn-secondary" target="_blank" style="width: 100%;">
                        Ler no jw.org
                    </a>
                </div>
            </div>

            <!-- Informações do Livro -->
            <div id="info-livro" class="info-section" style="display: none;">
                <h3 id="titulo-info">Informações sobre o livro</h3>
                <div class="tabela-info">
                    <p><strong>Tempo abrangido:</strong> <span id="info-tempo"></span></p>
                    <p><strong>Escrita terminada:</strong> <span id="info-escrita"></span></p>
                    <p><strong>Lugar:</strong> <span id="info-lugar"></span></p>
                    <p><strong>Escritor(es):</strong> <span id="info-escritor"></span></p>
                </div>
            </div>

            <!-- Conteúdo do Livro -->
            <div id="conteudo-livro" class="conteudo-section" style="display: none;">
                <h3 id="titulo-conteudo">Conteúdo do livro</h3>
                <div id="texto-conteudo"></div>
            </div>

            <!-- Vídeos Relacionados -->
            <div id="videos-livro" class="videos-section" style="display: none;">
                <h3 id="titulo-videos">Vídeos relacionados</h3>
                <div id="lista-videos"></div>
            </div>

        </main>

        <!-- Rodapé -->
        <footer class="app-footer">
            <div class="versiculo-box">
                <p>"Este livro da Lei deve estar sempre em seus lábios; LEIA-O em voz baixa DIA e NOITE..."</p>
                <span>Josué 1:8</span>
            </div>
        </footer>

    </div>

    <script src="dados.js"></script>
    <script src="comentarios.js"></script>
    <script src="script.js"></script>
</body>
</html>
