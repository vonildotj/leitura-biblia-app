name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Instalar Sharp para os ícones
      run: npm install sharp

    - name: Preparar pasta www
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp *.css www/ || true
        cp *.js www/ || true
        cp *.png www/ || true
        cp *.json www/ || true

    - name: Preparar Capacitor (Init e Add)
      run: |
        npx cap init "Leitura Diária" "com.leitura.diaria" --web-dir=www || true
        npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar ícones para Android
      run: |
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function gerar() {
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join('android', 'app', 'src', 'main', 'res', folder);
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }
              if (fs.existsSync('icon.png')) {
                await sharp('icon.png')
                  .resize(size, size)
                  .toFile(path.join(dir, 'ic_launcher.png'));
                
                await sharp('icon.png')
                  .resize(size, size)
                  .toFile(path.join(dir, 'ic_launcher_round.png'));
                  
                console.log('Imagens geradas: ' + folder);
              }
            }

            const anyDpiDir = path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26');
            if (!fs.existsSync(anyDpiDir)) {
              fs.mkdirSync(anyDpiDir, { recursive: true });
            }
            
            const xmlContent = `<?xml version=\"1.0\" encoding=\"utf-8\"?>
<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
    <background android:drawable=\"@color/ic_launcher_background\"/>
    <foreground android:drawable=\"@mipmap/ic_launcher\"/>
</adaptive-icon>`;
            
            fs.writeFileSync(path.join(anyDpiDir, 'ic_launcher.xml'), xmlContent);
            console.log('Adaptive Icon XML criado.');
          }
          
          gerar().catch(err => {
            console.error(err);
            process.exit(1);
          });
        "

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk