name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Instalar Sharp
      run: npm install sharp

    - name: Preparar pasta www
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp *.css www/ || true
        cp *.js www/ || true
        cp *.png www/ || true
        cp *.json www/ || true

    - name: Preparar Capacitor (Init e Add)
      run: |
        # MUDANÇA AQUI: O nome do app agora é "Leia a Bíblia"
        npx cap init "Leia a Bíblia" "com.leia.biblia" --web-dir=www || true
        npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar ícone com a imagem real e configurar Android
      run: |
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function gerar() {
            // Verifica se a imagem icon.png existe na raiz
            if (!fs.existsSync('icon.png')) {
              console.error('ERRO: O arquivo icon.png não foi encontrado na raiz do projeto!');
              process.exit(1);
            }

            // 1. Gera a imagem redimensionada com margem
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join('android', 'app', 'src', 'main', 'res', folder);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
              
              const innerSize = Math.floor(size * 0.7);
              const padding = Math.floor((size - innerSize) / 2);
              
              // MUDANÇA AQUI: Agora usa o seu icon.png em vez do quadrado amarelo
              await sharp('icon.png')
                .resize(innerSize, innerSize, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .extend({ top: padding, bottom: padding, left: padding, right: padding, background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }

            // 2. Define a cor de fundo do ícone (Branco para combinar com a Bíblia)
            const valuesDir = path.join('android', 'app', 'src', 'main', 'res', 'values');
            if (!fs.existsSync(valuesDir)) fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(path.join(valuesDir, 'ic_launcher_background.xml'), '<resources>\n    <color name=\"ic_launcher_background\">#FFFFFF</color>\n</resources>');

            // 3. Cria o arquivo XML que junta o fundo e a imagem
            const anyDpiDir = path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26');
            if (!fs.existsSync(anyDpiDir)) fs.mkdirSync(anyDpiDir, { recursive: true });
            
            const xmlContent = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <background android:drawable=\"@color/ic_launcher_background\"/>\n    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>\n</adaptive-icon>';
            
            fs.writeFileSync(path.join(anyDpiDir, 'ic_launcher.xml'), xmlContent);
          }
          
          gerar().catch(err => { console.error(err); process.exit(1); });
        "

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
