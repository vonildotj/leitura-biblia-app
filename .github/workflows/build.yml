name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Instalar Sharp para os ícones
      run: npm install sharp

    - name: Preparar pasta www
      run: |
        mkdir -p www
        # Copia o index.html
        cp index.html www/ || true
        
        # Copia pastas inteiras se existirem (CSS, JS, Imagens, etc)
        cp -r css www/ || true
        cp -r js www/ || true
        cp -r img www/ || true
        cp -r assets www/ || true
        cp -r imagens www/ || true
        
        # Copia arquivos soltos na raiz do projeto
        cp *.css www/ || true
        cp *.js www/ || true
        cp *.jpg www/ || true
        cp *.png www/ || true
        cp *.json www/ || true
        cp *.ico www/ || true

    - name: Preparar Capacitor (Init e Add)
      run: |
        # Cria a configuração do Capacitor apontando para a pasta www
        npx cap init "Leitura Diária" "com.leitura.diaria" --web-dir=www || true
        # Adiciona a plataforma Android (se já existir, ele ignora)
        npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar ícones para Android
      run: |
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function gerar() {
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join('android', 'app', 'src', 'main', 'res', folder);
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }
              // Verifica se o icon.png existe na raiz antes de tentar redimensionar
              if (fs.existsSync('icon.png')) {
                await sharp('icon.png')
                  .resize(size, size)
                  .toFile(path.join(dir, 'ic_launcher.png'));
                console.log('Gerado: ' + folder);
              }
            }
          }
          
          gerar().catch(err => {
            console.error(err);
            process.exit(1);
          });
        "

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
