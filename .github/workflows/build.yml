name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Preparar pasta www
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp *.css www/ || true
        cp *.js www/ || true
        cp *.png www/ || true
        cp *.json www/ || true

    - name: Preparar Capacitor (Init e Add)
      run: |
        npx cap init "Leitura Diária" "com.leitura.diaria" --web-dir=www || true
        npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # --- NOVO PASSO: USA A FERRAMENTA OFICIAL DO CAPACITOR PARA OS ÍCONES ---
    - name: Gerar ícones com Capacitor Assets
      run: |
        # Instala a ferramenta oficial de assets do Capacitor
        npm install @capacitor/assets --save-dev
        # Gera os ícones e splashes a partir do arquivo icon.png na raiz
        npx capacitor-assets generate --android
    # -------------------------------------------------------------------------

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
