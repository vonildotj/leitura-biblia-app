    - name: Gerar ícones para Android
      run: |
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function gerar() {
            // 1. Gera as imagens PNG redimensionadas
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join('android', 'app', 'src', 'main', 'res', folder);
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }
              if (fs.existsSync('icon.png')) {
                await sharp('icon.png')
                  .resize(size, size)
                  .toFile(path.join(dir, 'ic_launcher.png'));
                
                // Gera também a versão redonda
                await sharp('icon.png')
                  .resize(size, size)
                  .toFile(path.join(dir, 'ic_launcher_round.png'));
                  
                console.log('Imagens geradas: ' + folder);
              }
            }

            // 2. Cria o arquivo Adaptive Icon (necessário para Android moderno)
            const anyDpiDir = path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26');
            if (!fs.existsSync(anyDpiDir)) {
              fs.mkdirSync(anyDpiDir, { recursive: true });
            }
            
            const xmlContent = `<?xml version=\"1.0\" encoding=\"utf-8\"?>
<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
    <background android:drawable=\"@color/ic_launcher_background\"/>
    <foreground android:drawable=\"@mipmap/ic_launcher\"/>
</adaptive-icon>`;
            
            fs.writeFileSync(path.join(anyDpiDir, 'ic_launcher.xml'), xmlContent);
            console.log('Adaptive Icon XML criado.');
          }
          
          gerar().catch(err => {
            console.error(err);
            process.exit(1);
          });
        "
