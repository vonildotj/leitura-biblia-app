name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Preparar pasta web
      run: npm run build

    - name: Preparar Capacitor
      run: |
        npx cap init "Leitura Diária" "com.leitura.diaria" --web-dir=www
        npx cap add android

    - name: Sincronizar arquivos
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # --- NOVO PASSO: GERAR E COPIAR OS ÍCONES ---
    - name: Instalar ImageMagick
      run: sudo apt-get install -y imagemagick

    - name: Gerar ícones para Android
      run: |
        # Lista de pastas de ícones do Android e seus tamanhos
        declare -A sizes=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
        
        for folder in "${!sizes[@]}"; do
          size=${sizes[$folder]}
          # Cria a pasta se não existir
          mkdir -p android/app/src/main/res/$folder
          # Redimensiona a imagem e salva como ic_launcher.png
          convert icon.png -resize ${size}x${size} android/app/src/main/res/$folder/ic_launcher.png
        done
    # ---------------------------------------------

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
