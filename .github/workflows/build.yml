name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Instalar Sharp
      run: npm install sharp

    - name: Preparar pasta www
      run: |
        mkdir -p www
        cp index.html www/ || true
        cp *.css www/ || true
        cp *.js www/ || true
        cp *.png www/ || true
        cp *.json www/ || true

    - name: Preparar Capacitor (Init e Add)
      run: |
        # MUDANÇA AQUI: Nome do app mudou para "Biblia Teste"
        npx cap init "Biblia Teste" "com.teste.biblia" --web-dir=www || true
        npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerar ícone de teste e configurar Android
      run: |
        node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };
          
          async function gerar() {
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join('android', 'app', 'src', 'main', 'res', folder);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
              
              // MUDANÇA AQUI: Cor do ícone agora é AMARELA (r: 255, g: 255, b: 0)
              await sharp({ create: { width: size, height: size, channels: 4, background: { r: 255, g: 255, b: 0, alpha: 1 } } })
                .png()
                .toFile(path.join(dir, 'ic_launcher.png'));
                
              await sharp({ create: { width: size, height: size, channels: 4, background: { r: 255, g: 255, b: 0, alpha: 1 } } })
                .png()
                .toFile(path.join(dir, 'ic_launcher_round.png'));
            }

            const anyDpiDir = path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26');
            if (!fs.existsSync(anyDpiDir)) fs.mkdirSync(anyDpiDir, { recursive: true });
            
            const xmlContent = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <background android:drawable=\"@color/ic_launcher_background\"/>\n    <foreground android:drawable=\"@mipmap/ic_launcher\"/>\n</adaptive-icon>';
            
            fs.writeFileSync(path.join(anyDpiDir, 'ic_launcher.xml'), xmlContent);
          }
          
          gerar().catch(err => { console.error(err); process.exit(1); });
        "

    - name: Compilar APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
